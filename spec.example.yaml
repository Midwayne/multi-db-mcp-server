# Full annotated spec. Copy to spec.yaml and edit.
# ${ENV} and ${ENV:-default} are expanded when the server starts.
#
# Quick start: you only need a connections list. See README.md for recipes.

server:
  name: Multi-Database MCP
  version: "0.1.0"
  serve_mode: stdio          # stdio for Cursor/Claude; http or sse for a network server
  port: 8080                 # used only when serve_mode is http or sse

defaults:
  access: read_only          # applied when a connection omits access
  connect_timeout: 10s
  inactivity_timeout: 30m
  connect_on_start: true     # ping each DB at startup
  fail_on_connect_error: true
  max_rows: 200              # safety cap on query results

connections:
  # The name is what the agent passes as `connection` on every tool call.
  - name: local-mongo
    type: mongodb            # aliases: mongo
    uri: ${MONGO_URI:-mongodb://localhost:27017}
    database: app            # default db_name for mongo_* tools
    access: read_only
    # tools:
    #   include: [mongo_find, mongo_count, mongo_list_collections]
    #   exclude: [mongo_aggregate]

  - name: analytics
    type: postgres           # aliases: postgresql, pg
    uri: ${POSTGRES_URI:-postgres://postgres:postgres@localhost:5432/app?sslmode=disable}
    access: read_write
    # If uri is omitted, these fields are combined instead:
    # host: localhost
    # port: 5432
    # user: postgres
    # password: ${PGPASSWORD}
    # database: app
    # ssl_mode: disable

  - name: cache
    type: redis
    uri: ${REDIS_URI:-redis://localhost:6379/0}
    access: read_only
    # host: localhost
    # port: 6379
    # password: ${REDIS_PASSWORD}
    # db: 0                  # Redis logical database index

# Leave include empty to enable every tool allowed by type + access.
tools:
  include: []
  exclude: []
